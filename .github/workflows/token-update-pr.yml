name: token-update-pr

# Figma/Tokens Studio 가 figma/tokens/*.json 을 푸시(또는 수동 실행)하면
# 토큰을 다시 빌드해 결과를 PR 로 올린다.

on:
  push:
    paths:
      - "figma/tokens/**"
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install

      # Tokens Studio(단일 파일 sync)가 tokens-studio.json 을 push 한 경우
      # 빌드 입력(tokens/light/dark.json)으로 되돌린 뒤(없으면 no-op),
      # alias 검증 + theme 재생성을 수행한다.
      - name: Import Tokens Studio -> build inputs
        run: npm run import:figma

      - name: Validate & rebuild tokens
        run: npm run sync:tokens

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "tokens: rebuild design tokens from figma"
          title: "🎨 디자인 토큰 업데이트"
          body: |
            Figma(Tokens Studio) 토큰 변경이 코드에 반영되었습니다. 머지하면 앱에 적용됩니다.
            - 입력: `figma/tokens/*.json`
            - 생성물: `packages/theme/src/tokens.generated.ts`, `packages/theme/src/variables.css`
          branch: bot/token-update
          add-paths: |
            figma/tokens/tokens.json
            figma/tokens/light.json
            figma/tokens/dark.json
            packages/theme/src/tokens.generated.ts
            packages/theme/src/variables.css
